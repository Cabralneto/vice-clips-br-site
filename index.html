<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vice Clips BR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap">
<style>
/* single column legal page, neon Vice City accent kept to the header rule */
:root{--bg:#fbf8fc;--fg:#1d1622;--muted:#625a69;--line:#e6dcea;--accent:#d61f8c;--accent2:#0b8f99;
--display:"Anton",Impact,"Arial Narrow",sans-serif;--body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140f18;--fg:#f1eaf4;--muted:#a99fb0;--line:#2f2536;--accent:#ff4fb4;--accent2:#3fd6df;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#140f18;--fg:#f1eaf4;--muted:#a99fb0;--line:#2f2536;--accent:#ff4fb4;--accent2:#3fd6df;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.65;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px 64px}
main{max-width:68ch;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:6px;padding-bottom:20px;border-bottom:3px solid var(--accent)}
.brand{font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--accent2);font-size:15px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,7vw,46px);line-height:1.05;margin:0;text-wrap:balance}
.meta{color:var(--muted);font-size:14px}
section{display:flex;flex-direction:column;gap:8px}
h2{font-size:18px;margin:0;text-wrap:balance}
p,ul{margin:0}ul{padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.en{border-top:1px solid var(--line);padding-top:24px;color:var(--muted)}
.en h2{color:var(--fg)}
a{color:var(--accent)}
</style>
</head><body><main><header><span class="brand">Vice Clips BR</span><h1>Vice Clips BR</h1><span class="meta">Canal independente de vídeos curtos sobre GTA. Sem vínculo com a Rockstar Games.</span></header><section><ul><li><a href="termos/">Termos de Uso</a></li><li><a href="privacidade/">Política de Privacidade</a></li></ul></section></main></body></html>
